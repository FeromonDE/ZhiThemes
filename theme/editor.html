<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZhiThemes Editor</title>
<link rel="icon" id="favicon" type="image/webp" href="data:,">
<style>
  :root {
    --bg: #0a0d14; --bg2: #0f131c; --panel: #141925; --panel2: #1a2030; --line: #242c3d; --line2: #303a50;
    --text: #e8ebf2; --muted: #8b94aa; --dim: #5d667c; --accent: #2fd0e6; --accent2: #5b7cff;
    --accent-ink: #04222a; --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
    --r: 10px; --head: 72px; --tabs: 0px; --side: 244px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; color: var(--text); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(1200px 500px at 85% -10%, rgba(47, 208, 230, .08), transparent 60%),
                     radial-gradient(900px 400px at -10% 110%, rgba(91, 124, 255, .07), transparent 60%), var(--bg);
         background-attachment: fixed; min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  /* ---- header + tabs ---- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(10, 13, 20, .86); backdrop-filter: blur(12px);
         border-bottom: 1px solid var(--line); }
  header { display: flex; gap: 8px; align-items: center; height: var(--head); padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .logo { width: 38px; height: 38px; flex: none; display: block; filter: drop-shadow(0 3px 10px rgba(47, 208, 230, .3)); }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  .brand h1 span { color: var(--muted); font-weight: 500; }
  #status { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 20px; background: var(--panel);
            border: 1px solid var(--line); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  #status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
                    background: var(--dim); vertical-align: 1px; }
  #status.ok { color: var(--ok); } #status.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status.err { color: var(--err); } #status.err::before { background: var(--err); }
  /* progress: a bar under the status pill (uploads to the PS5) and .zt-prog boxes (downloads, video) */
  #status { position: relative; }
  #stBar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); display: none;
           transition: width .2s; border-radius: 2px; }
  #status.prog #stBar { display: block; }
  #status.prog.wait #stBar { width: 30% !important; animation: ztWait 1.1s ease-in-out infinite alternate; }
  .zt-prog { position: relative; margin: 6px 0; padding: 7px 10px 10px; border-radius: 8px; background: var(--panel);
             border: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow: hidden; }
  .zt-prog b { font-weight: normal; position: relative; }
  .zt-prog i { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2));
               transition: width .2s; }
  .zt-prog.wait i { width: 30% !important; animation: ztWait 1.1s ease-in-out infinite alternate; }
  .ct-pic .zt-thumb { position: absolute; left: 6px; right: 6px; top: 6px; height: 3px; border-radius: 2px; background: #0006; overflow: hidden; }
  .ct-pic .zt-thumb i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .ct-pic .zt-thumb.wait i { width: 30%; animation: ztWait 1.1s ease-in-out infinite alternate; }
  @keyframes ztWait { from { margin-left: 0; } to { margin-left: 70%; } }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  /* the theme's name in the middle of the top bar (click to change) */
  header .brand { margin-right: 0; flex: 1 1 0; }
  #themeTitleBox { flex: 0 1 auto; min-width: 0; display: flex; justify-content: center; }
  #themeTitleBox + .grow { flex: 1 1 0; }
  #themeTitle { max-width: 100%; box-sizing: border-box;
                font: 700 26px/1 'Orbitron', 'Segoe UI', system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 6px 14px; border-radius: 10px;
                background: linear-gradient(90deg, #fff 0%, var(--accent) 55%, var(--accent2) 100%);
                -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
  #themeTitle small { display: block; font: 500 10px/1 system-ui, sans-serif; letter-spacing: 3px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 1500px) { #themeTitle { font-size: 20px; letter-spacing: 1px; } header .brand h1 span { display: none; } }
  header .brand h1 { overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { #themeTitleBox { display: none; } header .brand { flex: 0 1 auto; margin-right: auto; } }
  /* themes on the PS5 (Themes/<Name>.ztheme) */
  #themesWrap { position: relative; }
  #btnThemes { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  #btnThemes b { color: var(--accent); font-weight: 650; }
  #themesPanel { position: absolute; right: 0; top: calc(100% + 6px); width: 540px; max-width: calc(100vw - 32px); max-height: 70vh; overflow: auto; z-index: 40;
                 background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 10px;
                 box-shadow: 0 12px 40px rgba(0, 0, 0, .5); display: none; }
  #themesPanel.open { display: block; }
  #themesPanel .th-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
  #themesPanel .th-row:hover { background: var(--panel2); }
  #themesPanel .th-row.on { box-shadow: inset 2px 0 0 var(--accent); background: var(--bg2); }
  #themesPanel .th-name { flex: 1 0 auto; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #themesPanel .th-size { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  #themesPanel .th-row button { padding: 3px 8px; font-size: 12px; }
  #themesPanel .th-new { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  #themesPanel .th-new button { flex: 1; }
  #themesPanel .th-tip { color: var(--muted); font-size: 12px; margin: 6px 4px 2px; }
  button, label.btn, select.btn, a.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; line-height: 1.3;
    transition: border-color .12s, background .12s, color .12s;
  }
  button:hover, label.btn:hover, select.btn:hover, a.btn:hover { border-color: var(--line2); background: var(--panel2); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: linear-gradient(135deg, var(--accent), #3fb6ff); border-color: transparent; color: var(--accent-ink);
                   font-weight: 650; padding: 6px 16px; box-shadow: 0 4px 14px rgba(47, 208, 230, .25); }
  button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), #3fb6ff); }
  /* tabs in a side bar on the left */
  body { padding-left: var(--side); }
  .top { margin-left: calc(-1 * var(--side)); }
  nav#tabs { position: fixed; left: 0; top: var(--head); bottom: 0; width: var(--side); z-index: 15; display: flex; flex-direction: column;
             gap: 3px; padding: 10px 8px 16px; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--line);
             background: rgba(10, 13, 20, .72); backdrop-filter: blur(10px); scrollbar-width: thin; }
  nav#tabs .side-top { display: flex; flex-direction: column; gap: 6px; padding: 0 2px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  nav#tabs .side-top .advsw { justify-content: center; }
  nav#tabs .tablist { display: flex; flex-direction: column; gap: 3px; }
  nav#tabs button.tab { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
                        color: var(--muted); padding: 7px 8px; border-radius: 10px; font-weight: 500; }
  nav#tabs button.tab:hover { color: var(--text); background: var(--panel); }
  nav#tabs button.tab.on { color: var(--text); background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  nav#tabs .ti { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--panel);
                 border: 1px solid var(--line); }
  nav#tabs .ti svg { width: 20px; height: 20px; }
  nav#tabs button.tab.on .ti { color: var(--accent); border-color: rgba(47, 208, 230, .45); background: rgba(47, 208, 230, .08); }
  nav#tabs .tt { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
  nav#tabs .tt b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav#tabs .tt small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav#tabs .count { flex: none; font-size: 10.5px; font-weight: 650; color: var(--accent-ink); background: var(--accent); border-radius: 10px;
                    padding: 0 6px; min-width: 18px; text-align: center; }
  #search { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 10px; font: inherit; font-size: 13px; }
  #tabhead { display: flex; gap: 18px; align-items: center; max-width: 1280px; margin: 0 auto; padding: 18px 20px 0; }
  #tabhead .tabpic { width: 192px; height: 108px; flex: none; }
  #tabhead h2 { margin: 0; font-size: 20px; font-weight: 650; }
  #tabhead .th-desc { margin: 2px 0 0; color: var(--muted); }
  #tabhead .th-n { margin: 6px 0 0; font-size: 12px; color: var(--dim); } #tabhead .th-n b { color: var(--accent); font-weight: 600; }
  #tabhead .th-sub { display: flex; gap: 6px; margin-top: 10px; }
  #tabhead .th-sub button.on { border-color: var(--accent); color: var(--accent); }
  /* tablet: a narrower side bar, still with the names */
  @media (max-width: 1100px) {
    :root { --side: 196px; }
    nav#tabs .tt small { display: none; }
    nav#tabs .ti { width: 30px; height: 30px; }
  }
  @media (max-width: 900px) {
    .brand h1, #fwinfo { display: none; }
    #tabhead .tabpic { width: 128px; height: 72px; }
    #status { max-width: 200px; }
  }
  main { padding: 18px 20px 40px; max-width: 1280px; margin: 0 auto; }
  main.wide { max-width: none; padding: 12px 16px 16px; }
  /* ---- field cards ---- */
  .section { margin-bottom: 22px; }
  .iconstrip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .iconbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 104px; padding: 12px 6px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); color: var(--text); cursor: pointer; font: inherit; }
  .iconbtn:hover, .iconbtn:focus-visible { border-color: var(--accent); outline: none; }
  .iconbtn.off .ib-pic { opacity: .35; }
  .ib-pic { display: grid; place-items: center; width: 40px; height: 40px; }
  .ib-pic svg, .ib-pic img { width: 34px; height: 34px; object-fit: contain; }
  .ib-name { font-size: 13px; font-weight: 600; }
  .ib-state { font-size: 11px; color: var(--muted); }
  .iconbtn:not(.off) .ib-state { color: var(--accent); }
  .subhead { font-size: 12px; color: var(--muted); font-weight: 600; margin: 4px 0 10px; }
  .iw-back { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
  .iw { width: min(920px, 100%); max-height: 86vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line2);
    border-radius: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .iw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .iw-head h3 { margin: 0; font-size: 18px; flex: 1; }
  .iw-close { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 650;
                margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--r);
          padding: 10px 12px 11px; transition: border-color .12s; min-width: 0; }
  .card:hover { border-color: var(--line2); }
  .card.changed { border-color: rgba(47, 208, 230, .35); }
  .card .head { display: flex; gap: 8px; align-items: center; min-height: 22px; }
  .card .key { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .id { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .reset { padding: 0 6px; font-size: 12px; border-radius: 6px; color: var(--accent); background: none;
                 border-color: transparent; visibility: hidden; }
  .card.changed .reset { visibility: visible; }
  .card .reset:hover { border-color: var(--accent); background: none; }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .fab { color: var(--dim); white-space: nowrap; }
  /* the tabs (showSections): each group a panel, each field one line with
     the name on the left and the control + value on the right; the
     explanation is the name's tooltip */
  .section.rows { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px 8px; margin-bottom: 14px;
    max-width: 880px; }
  .section.rows h2 { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 650; margin: 0 0 6px; }
  .section.rows h2::after { display: none; }
  .section.rows .grid { display: block; }
  .section.rows .card { display: grid; grid-template-columns: minmax(150px, 36%) minmax(0, 1fr); align-items: center; column-gap: 18px;
    background: none; border: 0; border-radius: 0; padding: 7px 0; }
  .section.rows .card + .card { border-top: 1px solid rgba(255, 255, 255, .04); }
  .section.rows .card.dep-off { display: none; }
  /* hue: the slider is the colour wheel */
  .card[data-key=particlesHue] input[type=range] { -webkit-appearance: none; appearance: none; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .card[data-key=particlesHue] input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; border: 2px solid #0b1220; box-shadow: 0 0 0 1px #fff; }
  .card[data-key=particlesHue] input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .chipset { display: flex; flex-wrap: wrap; gap: 6px; }
  .chipbtn { font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 12px; border: 1px solid var(--line2);
    background: transparent; color: var(--muted); cursor: pointer; }
  .chipbtn.on { background: rgba(47, 208, 230, .16); border-color: var(--accent); color: var(--text); }
  .section.rows .grid h4.grouphead { margin: 14px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .8px;
    text-transform: uppercase; color: var(--accent); opacity: .85; }
  .section.rows .grid h4.grouphead:first-child { margin-top: 4px; }
  .section.rows .grid h4.grouphead + .card { border-top: 0; }
  .section.rows h2 .allsw-txt { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .section.rows h2 .allsw { margin-left: 4px; }
  .section.rows.cols2 .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; }
  .section.rows.cols2 .card { grid-template-columns: minmax(0, 1fr) auto; }
  .section.rows.cols2 .card + .card { border-top: 0; }
  .section.rows.cols2 .card:has(input[type=range]) { grid-column: 1 / -1; grid-template-columns: minmax(150px, 36%) minmax(0, 1fr); }
  /* a second switch in the same group starts its own part */
  .section.rows .card[data-key="playInfoOn"] { border-top: 1px solid var(--line2); margin-top: 8px; padding-top: 12px; }
  .section.rows .card.adv { border-left: 0; }
  .section.rows .card .head { min-height: 0; gap: 6px; }
  .section.rows .card .key { font-weight: 500; color: #c9d1e0; cursor: help; }
  .section.rows .card.changed .key { color: var(--text); }
  .section.rows .card.changed .key::before { content: "• "; color: var(--accent); }
  .section.rows .card .id, .section.rows .card .hint { display: none; }
  .section.rows .card .ctl { margin-top: 0; min-width: 0; }
  .section.rows .card .depwarn, .section.rows .card .link { grid-column: 1 / -1; }
  .section.rows .card .ctl input[type=range] { flex: 1; min-width: 0; }
  .section.rows .card .ctl input[type=number] { width: 62px; flex: none; text-align: right; background: transparent; border-color: transparent; }
  .section.rows .card .ctl input[type=number]:hover, .section.rows .card .ctl input[type=number]:focus { border-color: var(--line2); background: var(--bg2); }
  .section.rows .card .head .advtag { font-size: 9px; padding: 0 5px; }
  /* the Screen tab's element panel: compact, name above the control */
  .vpanel .card { background: none; border: 0; border-radius: 0; padding: 8px 0; }
  .vpanel .card + .card { border-top: 1px solid rgba(255, 255, 255, .05); }
  .vpanel .card.adv { border-left: 0; }
  .vpanel .card .hint, .vpanel .card .id { display: none; }
  .vpanel .card .ctl { margin-top: 5px; }
  .vpanel .card .key { font-weight: 500; color: #c9d1e0; cursor: help; }
  .vpanel .card.changed .key { color: var(--text); }
  .vpanel .card.changed .key::before { content: "• "; color: var(--accent); }
  .vpanel .card .ctl input[type=range] { flex: 1; min-width: 0; }
  .vpanel .card .ctl input[type=number] { width: 62px; flex: none; text-align: right; background: transparent; border-color: transparent; }
  .vpanel .card .head .advtag { font-size: 9px; padding: 0 5px; }
  /* the icon / box windows: one line per option, like the tabs */
  .iw .grid { display: block; }
  .iw .card { display: grid; grid-template-columns: minmax(140px, 36%) minmax(0, 1fr); align-items: center; column-gap: 18px;
              background: none; border: 0; border-radius: 0; padding: 7px 0; }
  .iw .card + .card { border-top: 1px solid rgba(255, 255, 255, .05); }
  .iw .card.dep-off { display: none; }
  .iw .card.adv { border-left: 0; }
  .iw .card .hint, .iw .card .id { display: none; }
  .iw .card .ctl { margin-top: 0; min-width: 0; }
  .iw .card .key { font-weight: 500; color: #c9d1e0; cursor: help; }
  .iw .card.changed .key::before { content: "• "; color: var(--accent); }
  .iw .card .ctl input[type=range] { flex: 1; min-width: 0; }
  .iw .card .ctl input[type=number] { width: 62px; flex: none; text-align: right; background: transparent; border-color: transparent; }
  .iw .card .depwarn { grid-column: 1 / -1; }
  /* one colour control for every colour field */
  .colour { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
  .icoprev { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 7px; background: var(--bg2); border: 1px solid var(--line); }
  .icoprev img { width: 24px; height: 24px; object-fit: contain; }
  .icogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .icocell { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px 7px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; color: var(--muted); cursor: pointer; font: inherit; min-width: 0; }
  .icocell:hover, .icocell:focus-visible { border-color: var(--accent); color: var(--text); outline: none; }
  .icocell img { width: 40px; height: 40px; object-fit: contain; }
  .icocell span { font-size: 10.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .colour .swatch { position: relative; width: 44px; height: 28px; border-radius: 8px; border: 1px solid var(--line2); cursor: pointer; overflow: hidden;
    background: repeating-conic-gradient(#888 0 25%, #ccc 0 50%) 0 0 / 10px 10px; flex: none; }
  .colour .swatch span { position: absolute; inset: 0; }
  .colour .swatch.stock { background: var(--bg2); }
  .colour .swatch.stock span { background: linear-gradient(135deg, transparent 46%, var(--dim) 47% 53%, transparent 54%) !important; opacity: 1 !important; }
  .colour .swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .colour .cval { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); min-width: 64px; }
  .colour .calpha { flex: 1; min-width: 80px; }
  .colour .cstock { padding: 2px 10px; font-size: 12px; }
  .colour .cstock.on { border-color: var(--accent); color: var(--accent); }
  .colour .chips { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }

  .dist.h { height: 0; border-top: 3px solid var(--c); margin-top: -1.5px; }
  .dist.v { width: 0; border-left: 3px solid var(--c); margin-left: -1.5px; }
  .dist::before, .dist::after { content: ""; position: absolute; border: 9px solid transparent; }
  .dist.h::before { left: -2px; top: -10.5px; border-right-color: var(--c); border-left-width: 0; }
  .dist.h::after { right: -2px; top: -10.5px; border-left-color: var(--c); border-right-width: 0; }
  .dist.v::before { top: -2px; left: -10.5px; border-bottom-color: var(--c); border-top-width: 0; }
  .dist.v::after { bottom: -2px; left: -10.5px; border-top-color: var(--c); border-bottom-width: 0; }
  .dist span { position: absolute; font: 600 24px ui-monospace, Consolas, monospace; color: var(--c); white-space: nowrap;
               background: rgba(7, 10, 18, .82); padding: 1px 8px; border-radius: 6px; }
  .dist.h span { left: 50%; top: -38px; transform: translateX(-50%); }
  .dist.v span { top: 50%; left: 12px; transform: translateY(-50%); }
  .guide { position: absolute; background: #ff3fa4; z-index: 30; pointer-events: none; } .estimatedTxt { color: var(--warn); }

     every option with its name above and the control the whole width */
  @media (max-width: 700px) {
    body { padding-left: 0; }

<div class="top">
<header>
  <div class="brand"><img class="logo" id="brandLogo" alt=""><h1>ZhiThemes <span>· PS5 theme editor · by Zhi</span></h1></div>
  <div id="themeTitleBox"><div id="themeTitle" title="The theme in use. To change its name: Theme ▾ → Rename">…</div></div><span class="grow"></span>
  <span id="fwinfo" title="PS5 firmware and ZhiThemes version"></span>
  <div id="updWrap" hidden><button id="updPill" title="ZhiThemes update"></button><div id="updPanel"></div></div>
  <span id="status"><span id="statusTxt">loading…</span><i id="stBar"></i></span>
  <span class="sep"></span>
  <label class="btn advsw" title="Advanced: every field in each tab and Screen module, marked with an Advanced label. Off: the main fields only (in the Screen tab the rest is under More options)"><input type="checkbox" id="advSwitch"><span class="advtxt">Advanced</span></label>
  <div id="themesWrap">
    <button id="btnThemes" title="The themes on this PS5: switch, make, rename or delete one">Theme: <b id="themeNow">…</b> ▾</button>
    <div id="themesPanel"></div>
  </div>
  <label class="btn" for="file" title="Install a .ztheme (a theme with its wallpapers, icons and fonts; older theme files work too) as a theme of its own on this PS5 and use it. Your folders and custom tiles stay">Install</label>
  <input type="file" id="file" accept=".ztheme,.zip,.js,text/javascript,text/plain">
  <!-- "Letra…" cancelado (ZhiThemes 11) -->
  <input type="file" id="fontfile" accept=".otf,.ttf,.ttc">
  <input type="file" id="ps5bgfile" accept=".png,.jpg,.jpeg,.mp4">
  <button id="btnDownload" title="Save the theme in use as a .ztheme to share: its theme.json (settings, name, author, description) + the wallpaper, video, icons and fonts it shows (not your folders or custom tiles)">Download</button>
  <button id="btnFactory" title="Put every field back to the PS5 stock value and apply">Reset all</button>
  <button id="btnApply" class="primary" title="Save on the console and reload the Home (Ctrl+S)">Apply</button>
  <div id="moreWrap"><button id="btnMore" title="Install, Download, Reset all" aria-label="More">⋯</button>
    <div id="moreMenu"><button data-do="install">Install theme…</button><button data-do="download">Download theme</button><button data-do="reset">Reset all</button></div></div>
  <span id="reloadCount" hidden title="Home reloads in this ShellUI since it started" style="align-self:center;font-size:12px;opacity:.75;white-space:nowrap"></span>
</header>

  /* ================= About tab =================
     The project, its author and links. The GitHub and Ko-fi addresses come
     from the module (GET /sysinfo: home, kofi, set in zt_brand.hpp); while
     one is not set yet ('' or '<user>') it says "coming soon". */
  function realLink(u) { return /^https:\/\/[^<>\s]+$/.test(String(u || '')); }
  /* QR codes of the About links (made once with segno, error level M): one
     hex string per row, a set bit = a dark module. A link that is not in this
     table (a fork with its own links) shows no QR code. */
  var ABOUT_QR = {
    'https://github.com/itsRealZhi/ZhiThemes': [29, 'fe0a53f8,8292ea08,bac3b2e8,baf4c2e8,ba48bae8,820a0208,feaaabf8,00820800,82d64e70,514135b0,d6cd2880,89028440,83f70b08,f508fb98,df018ce0,9d92b1a8,4a401560,f19dd3b8,cea9b0c8,898c2a00,b35a5fb8,00f368c0,fe593ae0,82333898,ba061fc8,ba56fc68,ba3fbff0,82550368,fe8873a0'],
    'https://ko-fi.com/zhi': [25, 'fefabf8,821ea08,bae52e8,ba2f2e8,ba702e8,82e4a08,feaabf8,0069800,a308928,303db58,f7df068,75016c0,dbd1f08,4c05b18,c3f7868,1043dc0,d73ef90,00e8888,fe8ea88,8258890,ba27f88,ba254b0,ba915d8,8244d80,febcc48']
  };
  function qrSvg(url) {
    var q = ABOUT_QR[url];
    if (!q) return '';
    var n = q[0], rows = q[1].split(','), d = '', pad = 4;
    rows.forEach(function (h, y) {
      var bits = '';
      for (var i = 0; i < h.length; i++) bits += ('000' + parseInt(h[i], 16).toString(2)).slice(-4);
      for (var x = 0; x < n; x++) if (bits[x] === '1') d += 'M' + (x + pad) + ' ' + (y + pad) + 'h1v1h-1z';
    });
    var s = n + pad * 2;
    return '<svg class="qr" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img" aria-label="QR code: ' + url + '">' +
      '<rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }
  function showAbout() {
    view.innerHTML = '';
    var info = sysInfo || {};
    var sec = document.createElement('section');
    sec.className = 'section';
    sec.innerHTML = '<h2>About ZhiThemes</h2>' +
      '<div class="card about"><img class="aboutlogo" alt="ZhiThemes logo"><div class="key">ZhiThemes <span class="ver"></span></div>' +
      '<p>Custom themes for the PS5 Home screen, made by <b>Zhi</b>.</p>' +
      '<p>Change the tiles (square or vertical covers), the focus frame, fonts, colours, wallpapers (images or .mp4 ' +
      'video), game folders, custom covers and backgrounds per game, the Settings and Trophies screens, and more. ' +
      'Nothing is written to the system: everything happens in memory, and a reboot puts the stock PS5 back.</p>' +
      '<p>Share your theme with <b>Download</b> (one <b>.ztheme</b> file with its wallpaper, icons and fonts); ' +
      'others add it with <b>Install</b> (it becomes a theme of its own; switch themes with the <b>Theme</b> button). Folders and custom tiles always stay with each person.</p>' +
      '<p class="hint">Alpha version, tested on PS5 firmware 9.60. Problems or another firmware? Use the <b>Logs</b> ' +
      'tab and send the debug log.</p></div>';
    sec.querySelector('.aboutlogo').src = LOGO_URI;
    var ver = sec.querySelector('.ver');
    ver.textContent = (info.version || '') + (info.build ? ' (build ' + info.build + ')' : '');
    var links = document.createElement('div');
    links.className = 'sysgrid';
    links.style.marginTop = '10px';
    [['GitHub', 'Source code, releases, documentation and issues', info.home],
     ['Ko-fi', 'Like ZhiThemes? You can support it here', info.kofi]].forEach(function (l) {
      var d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = '<div class="key"></div><div class="hint"></div><div class="link"></div>';
      d.children[0].textContent = l[0];
      d.children[1].textContent = l[1];
      if (realLink(l[2])) {
        var a = document.createElement('a');
        a.href = l[2]; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = l[2];
        d.children[2].appendChild(a);
        var qd = document.createElement('div');
        qd.className = 'qrbox';
        var qr = qrSvg(l[2]);
        if (qr) {
          var qa = document.createElement('a');
          qa.href = l[2]; qa.target = '_blank'; qa.rel = 'noopener';
          qa.title = 'Open ' + l[2];
          qa.innerHTML = qr;
          qd.appendChild(qa);
        }
        var qt = document.createElement('div');
        var ob = document.createElement('a');
        ob.className = 'btn';
        ob.href = l[2]; ob.target = '_blank'; ob.rel = 'noopener';
        ob.textContent = l[0] === 'Ko-fi' ? 'Open Ko-fi ☕' : 'Open GitHub';
        qt.appendChild(ob);
        if (qr) {
          var sh = document.createElement('div');
          sh.className = 'hint';
          sh.style.marginTop = '6px';
          sh.textContent = 'or scan the code with your phone';
          qt.appendChild(sh);
        }
        qd.appendChild(qt);
        d.appendChild(qd);
      } else d.children[2].textContent = 'coming soon';
      links.appendChild(d);
    });
    sec.appendChild(links);
    var lic = document.createElement('p');
    lic.className = 'tip';
    lic.style.marginTop = '14px';
    lic.innerHTML = 'Free software under the GNU GPL v3; forks must keep the credit "ZhiThemes by Zhi". ' +
      'Built on OnionHEN by aydencharles and contributors. Thanks to AniketosHEN by xS3Cx, to SteamGridDB (covers, logos, backgrounds) ' +
      'and to motionbgs.com (animated backgrounds made by fans, searched from the editor; ZhiThemes ships none of them). ' +
      'Not affiliated with Sony Interactive Entertainment.';
    sec.appendChild(lic);
    view.appendChild(sec);
    if (!sysInfo) loadSysinfo().then(function (i) { if (i && current === 'about') showAbout(); });
  }
  /* ================= theme pack (.ztheme) =================
     A .ztheme is a ZIP of the theme's folder, made and read by the PS5
     (zt_install.cpp): theme.json + wallpapers/ icons/ fonts/. Download =
     GET /themes/pack, Install = POST /install (older theme files are
     translated there). The lists below only count the files a theme shows
     (Theme panel); zt_theme_pack_plan on the PS5 uses the same rules. */
  var PACK_WALL = /^(wallpaper|bgOverlay|sysBg|homeMusic)$/;
  var PACK_ICON = /^(search|settings|powerBtn|trophyBtn|padInfo)Icon$|^deco\dIcon$|^tabs(Game|Media|Recent|Fav|Never)Icon$|^tabsGroup(Left|Right)$|^footerIcon\d$|^particlesImage$/;
  /* a picture/video field goes into the pack only when the theme shows
     it (a wallpaper or Settings video left in an off field stays out) */
  function packUsed(k, vals) {
    var on = function (f) { return textValue(vals[f]) === 'true'; };
    if (k === 'wallpaper') return on('wallpaperOn');
    if (k === 'bgOverlay') return on('bgOverlayOn');

      renderTabs(); status('undone');
      if (V.live) changed();
      return;
    }
    if (current !== 'visual' || typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var e = BY[V.sel], step = ev.shiftKey ? 10 : 1;
    if (ev.key === 'Escape') { select(null); return; }
    if (!e) return;
    var keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (keys[ev.key]) { ev.preventDefault(); nudge(e, '', keys[ev.key][0], keys[ev.key][1]); }
    else if (ev.key === 'h' || ev.key === 'H') nudge(e, 'h');
  });

  var advSw = document.getElementById('advSwitch');
  advSw.checked = ADV;
  advSw.onchange = function () {
    ADV = advSw.checked;
    try { localStorage.setItem('zt.advanced', ADV ? '1' : '0'); } catch (e) {}
    renderTabs();
    status(ADV ? 'Advanced on: every field (marked Advanced)' : 'Advanced off: main fields only', 'ok');
  };
  load();
  loadSysinfo();
  updPoll();
})();
</script>
</body>
